name: test

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

  package:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
      - name: Install wheel and smoke-test CLI
        shell: bash
        run: |
          python -m venv .venv-package-smoke
          source .venv-package-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          loopback-litmus --help
          python -c "import loopback_litmus"

  public-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install immutable public release
        run: python -m pip install "git+https://github.com/itscloud0/loopback-litmus@26c01e8"
      - name: Smoke-test installed CLI
        run: |
          python -c "import loopback_litmus; assert loopback_litmus.__version__ == '0.1.0'"
          loopback-litmus --help
          loopback-litmus scan --known-agent-ports --json
      - name: Install immutable public source archive
        shell: bash
        run: |
          python -m venv .venv-archive-smoke
          source .venv-archive-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/itscloud0/loopback-litmus/archive/26c01e802e33ca4b285e1f4ba1149d0f20b50135.tar.gz"
          python -c "import loopback_litmus; assert loopback_litmus.__version__ == '0.1.0'"
          loopback-litmus --help
          loopback-litmus scan --known-agent-ports --json
